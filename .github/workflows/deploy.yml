name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh ESPN data + rebuild daily at 09:00 UTC
    - cron: "0 9 * * *"
    # NFL results: Thursday night, Sunday (every 3h), Monday night, Tuesday morning (UTC)
    - cron: "0 4,7 * * 5"
    - cron: "0 20,23 * * 0"
    - cron: "0 2,5,8 * * 1"
    - cron: "0 4,7,12 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh ESPN data
        run: node scripts/fetch-espn.mjs 2025 2026
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        continue-on-error: true # a flaky ESPN response shouldn't block deploys; committed snapshots remain
      - name: Refresh NFL pick'em slate
        run: node scripts/fetch-nfl.mjs
        continue-on-error: true
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
