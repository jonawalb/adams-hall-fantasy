name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly archive at 06:00 UTC = 2am EDT (1am EST): commits ESPN data to the repo
    - cron: "0 6 * * *"
    # NFL results: Thursday night, Sunday (every 3h), Monday night, Tuesday morning (UTC)
    - cron: "0 4,7 * * 5"
    - cron: "0 20,23 * * 0"
    - cron: "0 2,5,8 * * 1"
    - cron: "0 4,7,12 * * 2"
  workflow_dispatch:

permissions:
  contents: write # nightly archive commits data/ back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh ESPN data
        run: node scripts/fetch-espn.mjs 2025 2026
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        continue-on-error: true # a flaky ESPN response shouldn't block deploys; committed snapshots remain
      - name: Refresh NFL pick'em slate
        run: node scripts/fetch-nfl.mjs
        continue-on-error: true
      - name: Refresh college football snapshot
        run: node scripts/fetch-cfb.mjs
        continue-on-error: true
      - name: Archive ESPN transactions, draft, activity, lineups
        run: node scripts/archive-espn.mjs
        continue-on-error: true
      - name: Commit archived data
        # Only on scheduled/manual runs; pushes from GITHUB_TOKEN don't retrigger this workflow.
        if: github.event_name != 'push'
        run: |
          git config user.name "ahfl-archive[bot]"
          git config user.email "archive@adamshall.league"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): nightly ESPN archive $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
